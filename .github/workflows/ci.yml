name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-build:
    name: Test and Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run Unit & Integration Tests
        run: |
          go test -v -race ./...

      - name: Verify Cross-Platform Compilation
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/caramel-linux-amd64 ./cmd/caramel
          GOOS=windows GOARCH=amd64 go build -o dist/caramel-windows-amd64.exe ./cmd/caramel
